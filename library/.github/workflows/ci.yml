name: CI

on:
  push:

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: steamlike
          POSTGRES_USER: steamlike
          POSTGRES_PASSWORD: steamlike
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U steamlike"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB: steamlike
          POSTGRES_USER: steamlike
          POSTGRES_PASSWORD: steamlike
        run: |
          python manage.py test

      - name: Trigger Render Deploy
        if: success()
        run: |
          curl -X POST "TU_DEPLOY_HOOK_DE_RENDER"
